<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:opsz,wght@9..40,400;9..40,800&display=swap">
<title>Daily Frame</title>
<style>
:root{color-scheme:dark;--night:#14110f;--cream:#f6efe4;--muted:#a89a8a;--neon:#ff4f7b;--line:#3a322b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,rgba(255,79,123,.16),transparent 60%),var(--night);color:var(--cream);font-family:"DM Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.card{max-width:380px;display:flex;flex-direction:column;gap:18px;align-items:center}
.logo{font-family:"Bowlby One","Arial Black",sans-serif;font-size:clamp(46px,15vw,68px);line-height:.9;text-shadow:0 5px 0 var(--neon)}
p{color:var(--muted);line-height:1.5;font-size:16px}
p b{color:var(--cream)}
a.btn{display:block;width:100%;padding:15px 18px;border-radius:12px;background:var(--neon);color:#1a0610;font-weight:800;font-size:17px;text-decoration:none}
a.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">DAILY<br>FRAME</div>
  <p>Daily Frame now lives in the <b>Welcome To Bowling</b> app. Sign in with your WTB account to play and get on the leaderboard.</p>
  <a class="btn" href="https://welcometobowling.com/daily-frame">Play in Welcome To Bowling</a>
  <a class="btn ghost" href="https://welcometobowling.com/get-app">Get the app</a>
</div>
</body>
</html>
